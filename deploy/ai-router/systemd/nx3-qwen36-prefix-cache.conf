[Unit]
Wants=nx3-qwen36-cache-gateway.service
[Service]
Environment=HOST=127.0.0.1
Environment=PORT=18081
Environment=LD_LIBRARY_PATH=/home/nx/llama/prefix-cache-production/lib:/home/nx/llama/lib
