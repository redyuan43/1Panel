name: ai-router-lan-https
services:
  proxy:
    image: nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    container_name: ai-router-lan-https
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/1panel/ai-router-lan-https/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/1panel/ai-router-control-tls:/tls:ro
      - /opt/1panel/ai-router-lan-https/routes.conf:/etc/nginx/lan-api.conf:ro
      - /opt/1panel/ai-router-lan-https/ip-tls/live:/lan-tls:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
