version: 1

limits:
  max_request_bytes: 33554432
  image_token_estimate: 1024
  audio_token_estimate: 4096

vision:
  ai_max_dimension: 1024
  max_source_pixels: 40000000

identity:
  enabled: false
  public_model_id: siyuan/auto
  display_name_zh: 思源
  display_name_en: SIYUAN
  provider_name: SIYUAN
  description: 由思源智能路由服务提供的统一 AI 助手。
  identity_response: 我是思源（SIYUAN），由思源智能路由服务提供的统一 AI 助手。底层模型、节点和路由实现属于内部服务信息，不对外披露。
  review:
    mode: "off"
    base_url: http://agx.taild500c8.ts.net:11434
    model: qwen3:4b-instruct
    sample_rate: 0.1
    requests_per_minute: 2
    timeout_seconds: 15

routing:
  strategy: intelligent_v2
  default_output_reserve_tokens: 4096
  provider_priority: local_first
  prompt_directives:
    enabled: false
    revision: 1
    match: latest_user_contains
    persistence: conversation
    fallback: error
    retired_phrases: []
    reset:
      phrase: 恢复常规模式
      generation: 1
    routes:
      rilun:
        phrase: 按日轮协议处理
        endpoint_id: codex-pro-gpt-5.6-sol
        generation: 1
      beichen:
        phrase: 按北辰协议处理
        endpoint_id: codex-pro-gpt-6-astra
        generation: 1
      qinglan:
        phrase: 按青岚协议处理
        endpoint_id: cloud-deepseek-v4-pro
        generation: 1
      yuheng:
        phrase: 按玉衡协议处理
        endpoint_id: zhipu-glm-5.3-flash
        generation: 1
  affinity_capacity_wait_seconds: 120
  client_deployment_pins:
    - client_id: workbuddy-qwen36-shared
      model: siyuan/qwen36-shared
      endpoint_id: qwen36-shared-fleet
      deployment_id: qwen36-nx3
      capacity_wait_seconds: 900
  new_request_capacity_wait_seconds: 0
  all_local_busy_policy: cloud_or_429
  auto_max_input_tokens: 196608
  auto_max_output_tokens: 65536
  remote_fallback_order:
    general:
      - cloud-deepseek-v4-flash
      - zhipu-glm-5.3-flash
      - codex-pro-gpt-5.6-sol
    agent_text:
      - cloud-deepseek-v4-flash
      - zhipu-glm-5.3-flash
      - codex-pro-gpt-5.6-sol
    code:
      - zhipu-glm-5.3-flash
      - codex-pro-gpt-5.6-sol
      - cloud-deepseek-v4-flash
    complex_code:
      - codex-pro-gpt-5.6-sol
      - zhipu-glm-5.3-flash
      - cloud-deepseek-v4-flash
    multimodal:
      - zhipu-glm-5.3-flash
      - codex-pro-gpt-5.6-sol
    multimodal_complex_code:
      - codex-pro-gpt-5.6-sol
      - zhipu-glm-5.3-flash
  weights:
    quality: 0.50
    load: 0.20
    latency: 0.10
    context: 0.10
    cost: 0.05
    locality: 0.05

affinity:
  ttl_seconds: 86400
  max_priority_burst: 8

prefix_affinity:
  enabled: true
  revision: 3
  legacy_revision: 2
  ttl_seconds: 86400
  min_prompt_tokens: 2048
  checkpoint_tokens: 2048
  partial_min_tokens: 8192
  replica_on_busy_min_prompt_tokens: 12000
  capture_templates: true
  template_dir: /data/private/prefix-templates
  template_min_tokens: 12000
  template_client_ids:
    - workbuddy-qwen36-shared
    - hermes-qwen36-shared

queue:
  timeout_seconds: 120
  lock_ttl_seconds: 3600

health:
  refresh_seconds: 5
  stale_after_seconds: 15

failover:
  max_attempts: 2
  cooldown_seconds: 20

evaluator:
  enabled: false
  model_id: ai-qwen38-27b
  confidence_threshold: 0.85
  evaluate_task_changes: true
  long_context_threshold_tokens: 65536
  prefer_frontier_for_code_tools: true
  prefer_frontier_for_complex_code: true
  tool_task_mappings:
    home-automation:
      - homeassistant
      - hass
    code:
      - github
      - git
    batch:
      - batch

compaction:
  enabled: true
  mode: explicit_only
  model_id: ai-qwen38-27b

cloud:
  enabled: false
  auto_escalate: false
  monthly_budget: 0
  allowed_providers: []
  allowed_models: []

clients:
  policies:
    - id: 1panel
      key_env: AI_ROUTER_1PANEL_API_KEY
      models:
        - "*"
      rpm_limit: 120
      tpm_limit: 1000000
      max_parallel_requests: 8
      allow_compaction: false
      disclosure_mode: internal
    - id: check-boards
      key_env: AI_ROUTER_CHECK_BOARDS_API_KEY
      models:
        - auto
      rpm_limit: 240
      tpm_limit: 2000000
      max_parallel_requests: 4
      allow_compaction: false
      disclosure_mode: internal
