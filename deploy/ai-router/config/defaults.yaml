version: 1

limits:
  max_request_bytes: 33554432
  image_token_estimate: 1024
  audio_token_estimate: 4096

vision:
  ai_max_dimension: 1024
  max_source_pixels: 40000000

identity:
  enabled: false
  public_model_id: siyuan/auto
  display_name_zh: 思源
  display_name_en: SIYUAN
  provider_name: SIYUAN
  description: 由思源智能路由服务提供的统一 AI 助手。
  identity_response: 我是思源（SIYUAN），由思源智能路由服务提供的统一 AI 助手。底层模型、节点和路由实现属于内部服务信息，不对外披露。
  review:
    mode: "off"
    base_url: http://agx.taild500c8.ts.net:11434
    model: qwen3:4b-instruct
    sample_rate: 0.1
    requests_per_minute: 2
    timeout_seconds: 15

routing:
  strategy: intelligent_v2
  default_output_reserve_tokens: 4096
  provider_priority: local_first
  conversation_stability:
    enabled: false
    health_failure_threshold: 2
    health_recheck_interval_seconds: 10
    recovery_mode: manual
    preserve_tier_after_migration: true
  prompt_directives:
    enabled: false
    revision: 1
    match: latest_user_contains
    persistence: conversation
    fallback: error
    retired_phrases: []
    reset:
      phrase: 恢复常规模式
      generation: 1
    routes:
      rilun:
        phrase: 按日轮协议处理
        endpoint_id: codex-pro-gpt-5.6-sol
        generation: 1
      beichen:
        phrase: 按北辰协议处理
        endpoint_id: codex-pro-gpt-6-astra
        generation: 1
      qinglan:
        phrase: 按青岚协议处理
        endpoint_id: cloud-deepseek-v4-pro
        generation: 1
      yuheng:
        phrase: 按玉衡协议处理
        endpoint_id: zhipu-glm-5.3-flash
        generation: 1
  local_pool:
    enabled: false
    members: [ai-qwen38-27b, edge-qwen38-flash, amd-qwen38-rocmfpx-128k]
    recent_seconds: 600
    min_saving_ratio: 0.20
  affinity_capacity_wait_seconds: 120
  client_deployment_pins:
    - client_id: workbuddy-qwen36-shared
      model: siyuan/qwen36-shared
      endpoint_id: qwen36-shared-fleet
      deployment_id: qwen36-nx3
      context_overflow_deployment_id: qwen36-agx
      prewarm_min_prompt_tokens: 45000
      capacity_wait_seconds: 900
  client_route_bindings:
    - client_id: home-assistant
      requested_models:
        - auto
        - huihui/Qwen3.8-27B-Q4-DFlash2
        - huihui/Qwen3.8-27B-abliterated-NVFP4-GGUF
      target_endpoint_id: ai-qwen38-27b
      ignored_route_tiers: [local-large]
    - client_id: check-boards
      requested_models:
        - auto
        - huihui/Qwen3.8-27B-Q4-DFlash2
        - huihui/Qwen3.8-27B-abliterated-NVFP4-GGUF
      target_endpoint_id: ai-qwen38-27b
      ignored_route_tiers: [local-large]
  new_request_capacity_wait_seconds: 0
  all_local_busy_policy: cloud_or_429
  # Auto 对客户端声明 1,000,000 总上下文：934,464 输入 + 65,536 输出。
  # 这只是客户端预算上限；路由仍按每个端点的实测安全上下文逐一准入，
  # 本地端点能容纳时不会仅因该声明变大而提前使用云端。
  auto_max_input_tokens: 934464
  auto_max_output_tokens: 65536
  remote_fallback_order:
    general:
      - cloud-deepseek-v4-flash
      - zhipu-glm-5.3-flash
      - codex-pro-gpt-5.6-sol
    agent_text:
      - cloud-deepseek-v4-flash
      - zhipu-glm-5.3-flash
      - codex-pro-gpt-5.6-sol
    code:
      - zhipu-glm-5.3-flash
      - codex-pro-gpt-5.6-sol
      - cloud-deepseek-v4-flash
    complex_code:
      - codex-pro-gpt-5.6-sol
      - zhipu-glm-5.3-flash
      - cloud-deepseek-v4-flash
    multimodal:
      - zhipu-glm-5.3-flash
      - codex-pro-gpt-5.6-sol
    multimodal_complex_code:
      - codex-pro-gpt-5.6-sol
      - zhipu-glm-5.3-flash
  weights:
    quality: 0.50
    load: 0.20
    latency: 0.10
    context: 0.10
    cost: 0.05
    locality: 0.05
  # 启用效率档后先用满足硬约束的本地模型；本地上下文/能力/健康不满足，或
  # 现有性能迁移门槛触发时，才进入云端 Flash 候选。
  # 云端按北京时间严格锁定：工作时段只用 GLM 5.3 Flash，其余时间只用
  # DeepSeek V4.1 Flash。单元素列表表示所选云端不可用时直接报错，不跨厂商回退。
  # 时段开关保持安全默认关闭，由已启用效率档的生产策略经过发布门禁后打开。
  objectives:
    schedule:
      enabled: false
      timezone: Asia/Shanghai
      work_windows:
        - days: [MO, TU, WE, TH, FR]
          ranges: ["09:00-12:00", "14:00-18:00"]
      work_flash_order:
        general:
          - zhipu-glm-5.3-flash
        code:
          - zhipu-glm-5.3-flash
        multimodal:
          - zhipu-glm-5.3-flash
      off_hours_flash_order:
        general:
          - cloud-deepseek-v4-flash
        code:
          - cloud-deepseek-v4-flash
        multimodal:
          - cloud-deepseek-v4-flash

affinity:
  ttl_seconds: 86400
  max_priority_burst: 8

prefix_affinity:
  enabled: true
  revision: 3
  legacy_revision: 2
  ttl_seconds: 86400
  min_prompt_tokens: 2048
  checkpoint_tokens: 2048
  partial_min_tokens: 8192
  replica_on_busy_min_prompt_tokens: 12000
  capture_templates: true
  template_dir: /data/private/prefix-templates
  template_min_tokens: 12000
  template_client_ids:
    - workbuddy-qwen36-shared
    - hermes-qwen36-shared

lmcache:
  enabled: false
  endpoint_id: ai-qwen38-27b
  server_url: tcp://127.0.0.1:6555
  http_url: http://127.0.0.1:18084
  l1_size_gb: 80
  memory_max_gb: 96
  chunk_size: 1600
  separate_object_groups: true
  numa_node: 1

queue:
  timeout_seconds: 120
  lock_ttl_seconds: 3600

health:
  refresh_seconds: 5
  stale_after_seconds: 15
  probe_timeout_seconds: 3

failover:
  max_attempts: 2
  cooldown_seconds: 20
  empty_output_recovery:
    enabled: false
    client_ids:
      - workbuddy-public
    same_endpoint_retries: 1
    scheduled_cloud_fallback: true

evaluator:
  enabled: false
  model_id: ai-qwen38-27b
  confidence_threshold: 0.85
  evaluate_task_changes: true
  long_context_threshold_tokens: 65536
  prefer_frontier_for_code_tools: true
  prefer_frontier_for_complex_code: true
  tool_task_mappings:
    home-automation:
      - homeassistant
      - hass
    code:
      - github
      - git
    batch:
      - batch

compaction:
  summary_reasoning: provider_default
  summary_output_tokens: 8192
  enabled: true
  background_enabled: false
  background_limits:
    max_seconds: 600
    max_calls: 32
    max_input_tokens: 1000000
    max_output_tokens: 64000
  history_query_rewrite_enabled: false
  history_indexing:
    enabled: true
    batch_records: 8
    max_batch_seconds: 0.25
    duty_cycle: 0.2
  mode: explicit_only
  model_id: ai-qwen38-27b

context_policy:
  mode: legacy
  endpoint_id: codex-pro-gpt-6-astra
  extended_context_tokens: 500000

cloud:
  enabled: false
  auto_escalate: false
  monthly_budget: 0
  allowed_providers: []
  allowed_models: []

clients:
  policies:
    - id: 1panel
      key_env: AI_ROUTER_1PANEL_API_KEY
      models:
        - "*"
      rpm_limit: 120
      tpm_limit: 1000000
      max_parallel_requests: 8
      allow_compaction: false
      disclosure_mode: internal
    - id: check-boards
      key_env: AI_ROUTER_CHECK_BOARDS_API_KEY
      models:
        - siyuan/qwen38-v100-196k
      rpm_limit: 240
      tpm_limit: 2000000
      max_parallel_requests: 4
      allow_compaction: false
      disclosure_mode: internal
      local_only: true
