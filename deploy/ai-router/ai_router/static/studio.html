<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>创作工作室 · SIYUAN</title><link rel="stylesheet" href="/assets/studio-base.css"><link rel="stylesheet" href="/assets/studio.css">
<script defer src="/assets/studio-icons.js"></script><script defer src="/assets/studio.js"></script></head>
<body><header class="topbar"><div class="brand-block"><div class="brand-mark">S</div><div><strong>SIYUAN</strong><span>创作工作室</span></div></div>
<div class="topbar-actions"><span id="connectionStatus" role="status">尚未连接</span><a href="/">控制台</a><a href="/media/legacy">历史与设置</a><button id="newProjectButton" class="primary-small">新建创作</button></div></header>
<main class="creative-layout"><aside class="creative-sidebar"><form id="connectForm"><label>管理密钥<input id="adminKey" type="password" autocomplete="off" placeholder="使用当前控制台凭据"></label><button class="primary-small">连接</button></form><h2>创作记录</h2><div id="workflowList"></div></aside>
<div class="creative-main"><div id="notice" role="status" aria-live="polite"></div>
<section id="setupView" class="setup-view"><div class="setup-title"><div><span class="section-index">01</span><h1>从一个想法开始</h1></div><span class="availability">方案先行 · 样片可比较</span></div>
<form id="projectForm" class="project-form"><div class="form-main"><fieldset class="field"><legend>创作内容</legend><div class="segmented"><label><input type="radio" name="kind" value="video" checked>视频</label><label><input type="radio" name="kind" value="image">图片</label></div></fieldset>
<label class="field prompt-field"><span>你希望创作什么？</span><textarea name="prompt" id="promptInput" rows="7" maxlength="16000" required placeholder="描述主体、场景、动作和声音，也可以先告诉我一个大致方向。"></textarea></label>
<label class="field"><span>参考图片（最多5张，每张10MiB）</span><input id="assetFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><div id="assetFields" class="creative-assets"></div></div>
<aside class="setup-rail"><label class="rail-group">目标时长<input name="duration" type="number" min="4" max="15" value="15">秒</label><label class="rail-group">画幅<select name="aspect_ratio"><option value="9:16">9:16 竖屏</option><option value="16:9">16:9 横屏</option></select></label>
<label class="rail-group">候选方向<select name="candidate_count"><option value="1">1 个方向</option><option value="2">2 个方向</option><option value="3">3 个方向</option></select></label><label><input name="direction_images" type="checkbox">先生成方向图，确认后作为首帧</label><p class="muted">视频默认15秒、9:16、原生音频；确认方案后生成五秒样片。图片直接生成。</p><button id="createButton" class="create-button" disabled>开始创作</button></aside></form></section>
<section id="studioView" class="studio-view hidden"><div class="project-strip"><div><span id="projectMode" class="project-mode"></span><h1 id="projectTitle"></h1></div><div class="project-facts"><span id="projectStatus"></span><span id="projectVersion"></span><button id="cancelWorkflow" class="icon-text-button">取消任务</button></div></div>
<div class="pipeline-shell"><div id="pipeline" class="pipeline" aria-label="创作流程"></div></div>
<div id="workflowError" class="common-stage-error hidden" role="alert"></div>
<section class="creative-conversation"><div><h2>需求与方向</h2><div id="conversation"></div></div><form id="messageForm"><label>补充或修改要求<textarea name="message" rows="3" placeholder="例如：改成两个方向，保留产品外观，把背景换成海边。"></textarea></label><div class="creative-adjust"><label>时长<input name="duration" type="number" min="4" max="15"></label><label>画幅<select name="aspect_ratio"><option>9:16</option><option>16:9</option></select></label><label>方向数<select name="candidate_count"><option>1</option><option>2</option><option>3</option></select></label></div><div id="currentReferences" class="muted"></div><label>替换参考图片（可选，最多5张）<input id="revisionFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><div id="revisionAssets" class="creative-assets"></div><label><input type="checkbox" name="clear_assets">清除本版本参考图片</label><label id="revisionFramesLabel"><input type="checkbox" name="direction_images">先生成并确认方向图</label><button id="reviseButton" class="primary-small">更新方案</button></form></section>
<section><div class="stage-heading"><h2>候选方向</h2><span id="candidateHint"></span></div><div id="directions" class="creative-directions"></div><div id="planActions" class="stage-actions"></div></section>
<section id="productionPanel"><div class="stage-heading"><h2>完整视频与交付</h2><span id="productionHint"></span></div><div id="productionStages"></div></section>
<details class="creative-history"><summary>历史方案与产物</summary><div id="versionHistory"></div></details>
</section></div></main></body></html>
