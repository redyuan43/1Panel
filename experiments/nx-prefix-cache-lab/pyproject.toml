[project]
name = "nx-prefix-cache-lab"
version = "0.1.0"
description = "Independent WorkBuddy prefix-cache validation tooling for Jetson NX workers"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
router = [
  "cryptography==46.0.7",
  "fastapi==0.124.4",
  "httpx==0.28.1",
  "litellm[proxy]==1.84.0",
  "Pillow==11.3.0",
  "python-multipart==0.0.27",
  "PyYAML==6.0.3",
  "redis==5.2.1",
  "tomli==2.2.1; python_version < '3.11'",
  "async-timeout==5.0.1; python_version < '3.11'",
  "transformers==4.49.0",
  "uvicorn==0.33.0",
  "websockets==15.0.1",
]

[project.scripts]
prefix-cache-lab = "prefix_cache_lab.cli:main"

[tool.setuptools]
packages = ["prefix_cache_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
